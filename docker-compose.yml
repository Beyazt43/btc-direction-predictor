services:
  db:
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: uvicorn btcpred.api.main:app --host 0.0.0.0 --port 8000

  scheduler:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: python -m btcpred.scheduler

volumes:
  pgdata:
