services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    image: btcpred:local
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head
    restart: "no"

  api:
    image: btcpred:local
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    command: uvicorn btcpred.api.main:app --host 0.0.0.0 --port 8000
    volumes:
      - models:/app/models
    # /health round-trips the database, so this also fails if Postgres is gone.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 6s
      start_period: 20s
      retries: 3

  scheduler:
    image: btcpred:local
    # migrate stays without a restart policy on purpose: it is a one-shot job
    # and restarting it would loop forever.
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: python -m btcpred.scheduler
    volumes:
      - models:/app/models
      # A host bind mount, not a named volume: backups must survive the stack
      # and be reachable for copying somewhere else.
      - ${BACKUP_DIR:-./backups}:/app/backups
    # Docker only sees a process exit. A hung event loop looks alive forever,
    # so the tick touches a heartbeat file and this check fails if it goes
    # stale for three intervals.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time() - os.path.getmtime('/app/heartbeat') < 360 else 1)"]
      interval: 60s
      timeout: 5s
      start_period: 90s
      retries: 3

volumes:
  pgdata:
  models:
